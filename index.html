<div id="appearancePicker">

    <button id="portalAppearance" type="button" aria-label="Cambiar apariencia" aria-describedby="appearanceStatus" aria-haspopup="menu" aria-expanded="false" aria-controls="appearanceMenu" disabled>
      <svg class="appearance-sun" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>

    </button>
    <div id="appearanceMenu" role="menu" aria-label="Apariencia" hidden>
      <button type="button" role="menuitemradio" aria-checked="false" tabindex="-1" data-appearance-choice="light"><span>Claro</span><span class="appearance-check" aria-hidden="true">✓</span></button>
      <button type="button" role="menuitemradio" aria-checked="false" tabindex="-1" data-appearance-choice="dark"><span>Oscuro</span><span class="appearance-check" aria-hidden="true">✓</span></button>
      <button type="button" role="menuitemradio" aria-checked="true" tabindex="-1" data-appearance-choice="system"><span>Según tu dispositivo</span><span class="appearance-check" aria-hidden="true">✓</span></button>
