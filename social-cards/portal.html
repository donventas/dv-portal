<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>OG · Portal Don Ventas</title>
  <style>
    @import url('../assets/fonts/fonts.css');
    :root{color-scheme:dark;--ink:#0e1117;--paper:#eef1f6;--blue:#3b74f2;--line:rgba(238,241,246,.13)}
    *{box-sizing:border-box}html,body{width:1200px;height:630px;margin:0;overflow:hidden}body{background:var(--ink);color:var(--paper);font-family:'Schibsted Grotesk','Segoe UI',Arial,sans-serif}
    .card{position:relative;width:1200px;height:630px;overflow:hidden;padding:52px 64px 44px;background:radial-gradient(circle at 89% 13%,rgba(59,116,242,.21),transparent 25%),linear-gradient(rgba(238,241,246,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(238,241,246,.045) 1px,transparent 1px),var(--ink);background-size:auto,72px 72px,72px 72px,auto}
    .card:after{content:"";position:absolute;inset:12px;border:1px solid rgba(238,241,246,.12);pointer-events:none}.mast{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;height:72px}.logo{display:block;width:240px;height:auto}.number{font-family:'Space Mono',monospace;color:#7f8999;font-size:15px;letter-spacing:.11em}
    .layout{position:relative;z-index:2;display:grid;grid-template-columns:minmax(0,765px) 1fr;gap:55px;align-items:end;height:414px}.eyebrow{margin:0 0 22px;color:#9ca7b7;font-family:'Space Mono',monospace;font-size:15px;font-weight:700;line-height:1.4;letter-spacing:.12em;text-transform:uppercase}h1{margin:0;font-size:69px;font-weight:650;line-height:.98;letter-spacing:-.055em;text-wrap:balance}h1 em{color:var(--blue);font-family:Georgia,'Times New Roman',serif;font-weight:400}.support{max-width:670px;margin:24px 0 0;color:#c6ccd6;font-size:22px;line-height:1.35;letter-spacing:-.018em}
    .compass{align-self:center;position:relative;min-height:284px;border-left:1px solid var(--line);padding:2px 0 0 40px}.compass:before{content:"";position:absolute;left:-4px;top:12px;width:7px;height:7px;border-radius:50%;background:var(--blue);box-shadow:0 84px 0 var(--blue),0 168px 0 var(--blue)}.step{height:84px}.step small{display:block;color:#7f8999;font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.12em}.step strong{display:block;margin-top:8px;font-size:24px;letter-spacing:-.025em}.foot{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;height:48px;padding-top:22px;border-top:1px solid var(--line);font-family:'Space Mono',monospace;color:#9ca7b7;font-size:13px;letter-spacing:.09em;text-transform:uppercase}.foot b{color:var(--paper);font-weight:700}
  </style>
</head>
<body><main class="card">
  <header class="mast"><img class="logo" src="donventas-horizontal-curvas-reverse.svg" alt="Don Ventas"><span class="number">04 / PORTAL</span></header>
  <section class="layout">
    <div><p class="eyebrow">Próximamente · Portal Don Ventas</p><h1>La memoria de tu marca, <em>lista para trabajar.</em></h1><p class="support">Contexto, decisiones, entregables y aprendizajes conectados en un solo lugar.</p></div>
    <aside class="compass"><div class="step"><small>01</small><strong>Entender</strong></div><div class="step"><small>02</small><strong>Crear</strong></div><div class="step"><small>03</small><strong>Aprender</strong></div></aside>
  </section>
  <footer class="foot"><span><b>Un sistema que conserva contexto</b></span><span>app.donventas.mx</span></footer>
</main></body></html>
